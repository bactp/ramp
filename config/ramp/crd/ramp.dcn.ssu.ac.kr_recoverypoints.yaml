---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: recoverypoints.ramp.dcn.ssu.ac.kr
spec:
  group: ramp.dcn.ssu.ac.kr
  names:
    kind: RecoveryPoint
    listKind: RecoveryPointList
    plural: recoverypoints
    shortNames:
    - rp
    singular: recoverypoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.recoveryGroupRef
      name: Group
      type: string
    - jsonPath: .spec.epoch
      name: Epoch
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.logicalPosition
      name: P
      type: integer
    - jsonPath: .status.validation.validated
      name: Validated
      type: boolean
    - jsonPath: .status.validation.observedSkew
      name: Skew
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RecoveryPoint is a committed set of mutually consistent, immutable recovery
          artifacts for a RecoveryGroup, produced by one Recovery Epoch.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RecoveryPointSpec defines one Recovery Epoch to be executed.
            properties:
              barrierTimeoutSeconds:
                default: 30
                description: BarrierTimeoutSeconds bounds the QUIESCE/BARRIER stage.
                format: int32
                type: integer
              captureTimeoutSeconds:
                default: 300
                description: |-
                  CaptureTimeoutSeconds bounds the CAPTURE stage (including artifact
                  landing in the shared artifact store).
                format: int32
                type: integer
              epoch:
                description: Epoch is the monotonically increasing epoch number.
                format: int64
                type: integer
              faultInjection:
                description: FaultInjection is test-only; see FaultInjection.
                properties:
                  failRedisSnapshot:
                    description: FailRedisSnapshot aborts the epoch during CAPTURE
                      REDIS.
                    type: boolean
                  failVideoCheckpoint:
                    description: |-
                      FailVideoCheckpoint aborts the epoch during CAPTURE VIDEO, i.e. AFTER the
                      Redis epoch artifact already exists.
                    type: boolean
                  forcePositionSkew:
                    description: |-
                      ForcePositionSkew perturbs the recorded Redis artifact position by this
                      many logical positions, so VALIDATE sees two artifacts that disagree.
                    format: int64
                    type: integer
                  skipQuiesce:
                    description: |-
                      SkipQuiesce runs the epoch the old way -- without pausing the application
                      -- so the pre-fix behaviour remains reproducible for comparison.
                    type: boolean
                type: object
              maxPositionSkew:
                default: 0
                description: |-
                  MaxPositionSkew is the largest tolerated difference, in application
                  logical positions, between the container-checkpoint member's captured
                  in-memory position and the position frozen into the Redis epoch
                  snapshot. With a real quiesce this is expected to be 0; the knob stays so
                  that the tolerance is explicit rather than assumed.
                format: int64
                type: integer
              quiesceVerifySeconds:
                default: 3
                description: |-
                  QuiesceVerifySeconds is the interval between the two logical-position
                  samples that prove the application really stopped advancing.
                format: int32
                type: integer
              recoveryGroupRef:
                description: RecoveryGroupRef is the group this epoch captures.
                type: string
              requiredReplicaAcks:
                default: 1
                description: |-
                  RequiredReplicaAcks is the number of replicas that must acknowledge the
                  epoch marker write before the barrier counts as established. It is passed
                  to Redis WAIT; connected_replicas is not an acknowledgement.
                format: int32
                type: integer
            required:
            - epoch
            - recoveryGroupRef
            type: object
          status:
            description: RecoveryPointStatus is the observed state of a Recovery Epoch.
            properties:
              artifacts:
                items:
                  description: |-
                    RecoveryArtifact is one member's captured recovery state. Artifacts within a
                    RecoveryPoint are heterogeneous by design.
                  properties:
                    capturedAt:
                      format: date-time
                      type: string
                    checksum:
                      description: Checksum is the artifact's content digest (algorithm
                        in ChecksumAlgorithm).
                      type: string
                    checksumAlgorithm:
                      type: string
                    driver:
                      description: |-
                        RecoveryDriver names the recovery mechanism bound to a member. Different
                        members of the same RecoveryGroup deliberately use different drivers -- that
                        heterogeneity is the property Scenario 1 exists to demonstrate.
                      type: string
                    epoch:
                      description: |-
                        Epoch is stamped on every artifact so that "these artifacts belong to the
                        same recovery epoch" is checkable on the artifact itself, not inferred
                        from which object happens to carry it.
                      format: int64
                      type: integer
                    immutable:
                      description: |-
                        Immutable marks an artifact that cannot change after commit. A
                        replicationState reference is NOT immutable and is never restorable.
                      type: boolean
                    instanceFingerprint:
                      description: |-
                        InstanceFingerprint identifies the specific process instance whose state
                        was captured -- for the video member, the session id it generated in
                        memory at start and never persists. After a recovery it is the evidence
                        that distinguishes a genuine restore (same fingerprint) from a restart
                        that merely re-read the replicated state (new fingerprint).
                      type: string
                    logicalPosition:
                      description: |-
                        LogicalPosition is the application-level position this artifact
                        corresponds to. It is what makes two heterogeneous artifacts comparable.
                      format: int64
                      type: integer
                    member:
                      type: string
                    message:
                      type: string
                    nodeName:
                      type: string
                    nodePath:
                      type: string
                    ref:
                      description: |-
                        Ref is the canonical, resolvable reference to the artifact.
                          containerCheckpoint -> minio://<bucket>/<object>
                          redisSnapshot       -> minio://<bucket>/<object>
                          replicationState    -> redis-repl://<host>:<port>/<offset>  (diagnostic)
                      type: string
                    replicationId:
                      type: string
                    replicationOffset:
                      format: int64
                      type: integer
                    sizeBytes:
                      format: int64
                      type: integer
                    type:
                      description: ArtifactType distinguishes heterogeneous recovery
                        state within one epoch.
                      type: string
                  required:
                  - driver
                  - member
                  - type
                  type: object
                type: array
              barrier:
                description: BarrierStatus records the Redis replication acknowledgement
                  for this epoch.
                properties:
                  ackedReplicas:
                    description: AckedReplicas is what Redis WAIT actually returned.
                    format: int64
                    type: integer
                  endpoint:
                    description: Endpoint is the primary the marker was written to.
                    type: string
                  established:
                    type: boolean
                  establishedAt:
                    format: date-time
                    type: string
                  markerOffset:
                    description: |-
                      MarkerOffset is the primary replication offset immediately after the
                      epoch marker keys were written.
                    format: int64
                    type: integer
                  message:
                    type: string
                  position:
                    format: int64
                    type: integer
                  replicationId:
                    type: string
                  requiredReplicas:
                    description: RequiredReplicas is what was demanded.
                    format: int64
                    type: integer
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureReason:
                type: string
              lastSuccessfulStage:
                description: |-
                  LastSuccessfulStage is the furthest phase that completed. On a failure it
                  is what tells an operator where the epoch stopped.
                type: string
              logicalPosition:
                description: |-
                  LogicalPosition is P: the single application position this whole epoch
                  is anchored to.
                format: int64
                type: integer
              message:
                type: string
              phase:
                description: "RecoveryPointPhase is the Recovery Epoch state machine.
                  The order is fixed:\n\n\tPending -> Preparing -> Quiescing -> BarrierEstablished\n\t
                  \       -> CapturingRedis -> CapturingVideo -> Validating -> Committed\n\nAny
                  failure short-circuits through Aborting to Failed. ONLY Committed+validated\nis
                  recovery eligible; every other phase is explicitly not."
                type: string
              quiesce:
                description: |-
                  QuiesceStatus records that the application really was held still, and for
                  how long. Without it "the artifacts agree" is an accident, not a property.
                properties:
                  instanceFingerprint:
                    type: string
                  message:
                    type: string
                  position:
                    description: Position is the logical position P the application
                      was frozen at.
                    format: int64
                    type: integer
                  quiesced:
                    type: boolean
                  quiescedAt:
                    format: date-time
                    type: string
                  resumedAt:
                    format: date-time
                    type: string
                  verifySamples:
                    description: |-
                      VerifySamples are the two (or more) successive position samples taken
                      while quiesced; they must all be equal.
                    items:
                      format: int64
                      type: integer
                    type: array
                type: object
              runId:
                description: |-
                  RunID is the manager instance that owns the in-flight epoch. If a
                  reconcile finds a mid-flight epoch stamped with a different RunID the
                  manager restarted mid-epoch, and the epoch is aborted rather than resumed
                  against an application that has since moved on.
                type: string
              timings:
                description: EpochTimings records stage boundaries for the RTO/RPO
                  analysis.
                properties:
                  barrierReached:
                    format: date-time
                    type: string
                  captureComplete:
                    format: date-time
                    type: string
                  captureStart:
                    format: date-time
                    type: string
                  commitTime:
                    format: date-time
                    type: string
                  prepareStart:
                    format: date-time
                    type: string
                  quiesceComplete:
                    format: date-time
                    type: string
                  quiesceStart:
                    format: date-time
                    type: string
                  redisSnapshotComplete:
                    format: date-time
                    type: string
                  redisSnapshotStart:
                    format: date-time
                    type: string
                  resumeTime:
                    format: date-time
                    type: string
                  validateComplete:
                    format: date-time
                    type: string
                  videoCheckpointComplete:
                    format: date-time
                    type: string
                  videoCheckpointStart:
                    format: date-time
                    type: string
                type: object
              validation:
                description: ValidationResult is the cross-driver consistency verdict.
                properties:
                  checkpointPosition:
                    format: int64
                    type: integer
                  checks:
                    description: Checks is the per-condition validation record.
                    items:
                      description: ValidationCheck is one mandatory pre-commit condition.
                      properties:
                        detail:
                          type: string
                        name:
                          type: string
                        passed:
                          type: boolean
                      required:
                      - name
                      - passed
                      type: object
                    type: array
                  message:
                    type: string
                  observedSkew:
                    format: int64
                    type: integer
                  reason:
                    type: string
                  redisSnapshotPosition:
                    description: |-
                      RedisSnapshotPosition is the position frozen into the immutable Redis
                      artifact -- NOT the live replica's current position.
                    format: int64
                    type: integer
                  replicatedPosition:
                    description: |-
                      ReplicatedPosition is the live replication-stream position at commit,
                      kept as a diagnostic only.
                    format: int64
                    type: integer
                  validated:
                    description: Validated is true only when every mandatory consistency
                      check passed.
                    type: boolean
                required:
                - validated
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
