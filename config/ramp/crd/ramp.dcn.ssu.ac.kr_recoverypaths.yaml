---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: recoverypaths.ramp.dcn.ssu.ac.kr
spec:
  group: ramp.dcn.ssu.ac.kr
  names:
    kind: RecoveryPath
    listKind: RecoveryPathList
    plural: recoverypaths
    shortNames:
    - rpath
    singular: recoverypath
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readiness
      name: Readiness
      type: string
    - jsonPath: .spec.sourceCluster
      name: Source
      type: string
    - jsonPath: .spec.targetCluster
      name: Target
      type: string
    - jsonPath: .status.observedRecoveryPoint
      name: RecoveryPoint
      type: string
    - jsonPath: .status.estimatedRTO
      name: EstRTO
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RecoveryPath is an executable recovery plan for a RecoveryGroup together
          with the current readiness of its prerequisites.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RecoveryPathSpec is an executable recovery plan plus its prerequisites.
              A path is NOT merely a target cluster.
            properties:
              recoveryActions:
                description: |-
                  RecoveryActions documents the ordered plan this path would execute. It is
                  descriptive in Scenario 1 (actuation stays with the Transition Operator /
                  runbook) but it is part of the path definition, not of the target cluster.
                items:
                  type: string
                type: array
              recoveryGroupRef:
                description: RecoveryGroupRef is the group this path can recover.
                type: string
              recoveryPointRef:
                description: |-
                  RecoveryPointRef pins the path to one RecoveryPoint. Empty means "track
                  the group's latest committed RecoveryPoint".
                type: string
              sourceCluster:
                description: SourceCluster / TargetCluster are registered cluster
                  names.
                type: string
              targetCluster:
                type: string
              targetPrereqs:
                description: TargetPrereqs are the target-side prerequisites to evaluate.
                properties:
                  checkpointStagingPath:
                    default: /var/lib/kubelet/checkpoints
                    description: |-
                      CheckpointStagingPath is the on-node directory the checkpoint-agent
                      syncs artifacts into on the target cluster.
                    type: string
                  maxReplicationLagBytes:
                    default: 4096
                    description: |-
                      MaxReplicationLagBytes is the largest tolerated standby lag, in
                      replication-stream bytes, for RedisStandbyReady to hold.
                    format: int64
                    type: integer
                  minAllocatableCpuMillis:
                    description: MinAllocatable is the minimum free capacity required
                      on the target node.
                    format: int64
                    type: integer
                  minAllocatableMemoryMiB:
                    format: int64
                    type: integer
                  namespace:
                    description: Namespace the recovered RecoveryGroup will land in
                      on the target.
                    type: string
                  restoreCapabilityDaemonSet:
                    description: |-
                      RestoreCapabilityDaemonSet is the DaemonSet whose readiness proves the
                      target can stage and restore checkpoint artifacts.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  standbyEndpoint:
                    description: |-
                      StandbyEndpoint is the target-side Redis standby the redis-replication
                      driver will promote.
                    properties:
                      host:
                        description: Host is a routable address (floating IP or DNS
                          name).
                        type: string
                      port:
                        description: Port is the Redis port on that address.
                        format: int32
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                required:
                - namespace
                type: object
            required:
            - recoveryGroupRef
            - sourceCluster
            - targetCluster
            - targetPrereqs
            type: object
          status:
            description: RecoveryPathStatus is the observed readiness of the path.
            properties:
              checks:
                description: |-
                  Checks carries every evaluated prerequisite with its reason, so that
                  `kubectl get recoverypath <p> -o yaml` alone explains the readiness level.
                items:
                  description: ReadinessCheck is one deterministic prerequisite evaluation.
                  properties:
                    lastProbeTime:
                      format: date-time
                      type: string
                    mandatory:
                      description: Mandatory checks must all be True for HOT.
                      type: boolean
                    message:
                      type: string
                    name:
                      type: string
                    reason:
                      type: string
                    status:
                      description: Status is "True", "False" or "Unknown".
                      type: string
                  required:
                  - mandatory
                  - name
                  - status
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              estimatedRTO:
                description: |-
                  EstimatedRTO is a deterministic sum of the remaining activation steps for
                  the current readiness level. No prediction model is involved.
                type: string
              lastValidatedTime:
                format: date-time
                type: string
              observedEpoch:
                format: int64
                type: integer
              observedRecoveryPoint:
                description: ObservedRecoveryPoint is the RecoveryPoint this evaluation
                  was made against.
                type: string
              readiness:
                description: Readiness is the elastic recovery-readiness level of
                  a RecoveryPath.
                enum:
                - HOT
                - WARM
                - COLD
                type: string
              unmetMandatoryChecks:
                description: UnmetMandatoryChecks lists, by name, why the path is
                  not HOT.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
