---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: recoverypaths.ramp.dcn.ssu.ac.kr
spec:
  group: ramp.dcn.ssu.ac.kr
  names:
    kind: RecoveryPath
    listKind: RecoveryPathList
    plural: recoverypaths
    shortNames:
    - rpath
    singular: recoverypath
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readiness
      name: Readiness
      type: string
    - jsonPath: .spec.targetCluster
      name: Target
      type: string
    - jsonPath: .status.targetPlacement.node
      name: Node
      type: string
    - jsonPath: .status.preparedRecoveryPoint.name
      name: Prepared
      type: string
    - jsonPath: .status.candidateRecoveryPoint.name
      name: Candidate
      type: string
    - jsonPath: .status.latestRecoveryPoint.name
      name: Latest
      type: string
    - jsonPath: .status.contract.recoveryPointAge
      name: Age
      type: string
    - jsonPath: .status.estimatedRTO
      name: EstRTO
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RecoveryPath is an executable recovery plan for a RecoveryGroup together
          with the current readiness of its prerequisites.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RecoveryPathSpec is an executable recovery plan plus its prerequisites.
              A path is NOT merely a target cluster.
            properties:
              recoveryActions:
                description: RecoveryActions documents the ordered plan this path
                  would execute.
                items:
                  type: string
                type: array
              recoveryGroupRef:
                description: RecoveryGroupRef is the group this path can recover.
                type: string
              recoveryPointRef:
                description: |-
                  RecoveryPointRef pins the path to one RecoveryPoint. Empty means "track
                  the group's committed RecoveryPoints", which is NOT the same as "always
                  evaluate the newest one": see RecoveryPathStatus.
                type: string
              sourceCluster:
                description: SourceCluster / TargetCluster are registered cluster
                  names.
                type: string
              targetCluster:
                type: string
              targetPrereqs:
                description: TargetPrereqs are the target-side prerequisites to evaluate.
                properties:
                  activationPlanWorkload:
                    description: |-
                      ActivationPlanWorkload is the target workload object that preparation
                      creates ahead of the failure and that activation merely scales up and
                      re-images. Its annotations bind the prepared target to one RecoveryPoint.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  checkpointStagingPath:
                    default: /var/lib/kubelet/checkpoints
                    description: |-
                      CheckpointStagingPath is the on-node directory the checkpoint-agent
                      syncs artifacts into on the target cluster.
                    type: string
                  maxReplicationLagBytes:
                    default: 4096
                    description: |-
                      MaxReplicationLagBytes is the largest tolerated lag, in replication-stream
                      bytes, for the target Redis runtime to count as warm.
                    format: int64
                    type: integer
                  minAllocatableCpuMillis:
                    description: MinAllocatable is the minimum capacity a target node
                      must have free.
                    format: int64
                    type: integer
                  minAllocatableMemoryMiB:
                    format: int64
                    type: integer
                  namespace:
                    description: Namespace the recovered RecoveryGroup will land in
                      on the target.
                    type: string
                  node:
                    description: |-
                      Node pins placement to one target node. Empty means RAMP picks the first
                      feasible node in name order (and keeps the currently prepared node while
                      it stays feasible, so placement does not flap).
                    type: string
                  restoreCapabilityDaemonSet:
                    description: |-
                      RestoreCapabilityDaemonSet is the DaemonSet whose readiness ON THE
                      PLACEMENT NODE proves that node can stage and restore checkpoints.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  standbyEndpoint:
                    description: |-
                      StandbyEndpoint is the target-side Redis runtime. It is the instance the
                      epoch RDB is restored INTO; it is not itself the recovery point.
                    properties:
                      host:
                        description: Host is a routable address (floating IP or DNS
                          name).
                        type: string
                      port:
                        description: Port is the Redis port on that address.
                        format: int32
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                required:
                - namespace
                type: object
            required:
            - recoveryGroupRef
            - sourceCluster
            - targetCluster
            - targetPrereqs
            type: object
          status:
            description: RecoveryPathStatus is the observed readiness of the path.
            properties:
              candidateRecoveryPoint:
                description: CandidateRecoveryPoint is a newer point being prepared,
                  if any.
                properties:
                  commitTime:
                    format: date-time
                    type: string
                  epoch:
                    format: int64
                    type: integer
                  logicalPosition:
                    format: int64
                    type: integer
                  message:
                    type: string
                  missingPreparation:
                    description: |-
                      MissingPreparation lists, by check name, what still has to hold before
                      this candidate can be promoted.
                    items:
                      type: string
                    type: array
                  name:
                    type: string
                  observedAt:
                    description: ObservedAt is when this candidate was first noticed.
                    format: date-time
                    type: string
                required:
                - name
                type: object
              checks:
                description: |-
                  Checks carries every evaluated prerequisite with its reason, so that
                  `kubectl get recoverypath <p> -o yaml` alone explains the readiness level.
                items:
                  description: ReadinessCheck is one deterministic prerequisite evaluation.
                  properties:
                    lastProbeTime:
                      format: date-time
                      type: string
                    mandatory:
                      description: Mandatory checks must all be True for HOT.
                      type: boolean
                    message:
                      type: string
                    name:
                      type: string
                    reason:
                      type: string
                    status:
                      description: Status is "True", "False" or "Unknown".
                      type: string
                  required:
                  - mandatory
                  - name
                  - status
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              contract:
                description: Contract is the RecoveryContract evaluated against the
                  prepared point.
                properties:
                  activationSteps:
                    description: |-
                      ActivationSteps is the breakdown the estimate was summed from, so the
                      number can be audited instead of trusted.
                    items:
                      description: |-
                        ActivationStep is one deterministic unit of failure-time work, with the cost
                        assumption used for it. The estimate is a sum of these, never a prediction.
                      properties:
                        cost:
                          description: Cost is the assumed duration of this step.
                          type: string
                        name:
                          type: string
                        reason:
                          type: string
                        required:
                          description: Required is false for steps already paid for
                            by preparation.
                          type: boolean
                      required:
                      - cost
                      - name
                      - required
                      type: object
                    type: array
                  estimatedActivationLatency:
                    description: |-
                      EstimatedActivationLatency is the sum of the required ActivationSteps.
                      It is explicitly NOT an end-to-end RTO: no failure detection exists yet.
                    type: string
                  freshEnough:
                    type: boolean
                  freshnessRemaining:
                    description: |-
                      FreshnessRemaining is RPO - age; negative values are clamped to zero and
                      FreshEnough is false.
                    type: string
                  recoveryPointAge:
                    description: RecoveryPointAge is now - preparedRecoveryPoint.commitTime.
                    type: string
                  rpo:
                    type: string
                  rto:
                    type: string
                  rtoWithinContract:
                    type: boolean
                type: object
              estimatedRTO:
                description: EstimatedRTO mirrors contract.estimatedActivationLatency
                  as a string.
                type: string
              lastValidatedTime:
                format: date-time
                type: string
              latestRecoveryPoint:
                description: |-
                  LatestRecoveryPoint is the newest committed, validated RecoveryPoint
                  known for the group. It is INFORMATION, not the thing readiness is
                  evaluated against.
                properties:
                  commitTime:
                    format: date-time
                    type: string
                  epoch:
                    format: int64
                    type: integer
                  logicalPosition:
                    format: int64
                    type: integer
                  name:
                    type: string
                required:
                - name
                type: object
              observedEpoch:
                format: int64
                type: integer
              observedRecoveryPoint:
                description: |-
                  ObservedRecoveryPoint mirrors preparedRecoveryPoint.name. It is kept so
                  that existing recovery scripts keep resolving to the point that is
                  actually executable -- which, before this change, they did not.
                type: string
              preparedRecoveryPoint:
                description: PreparedRecoveryPoint is what this path would actually
                  recover from.
                properties:
                  artifacts:
                    items:
                      description: |-
                        PreparedArtifact is one piece of target-side preparation, recorded with
                        enough identity to prove it belongs to the prepared epoch and, where the
                        artifact is node-bound, to the prepared node.
                      properties:
                        checksum:
                          type: string
                        kind:
                          description: |-
                            Kind is the role the artifact plays: videoCheckpoint, checkpointImage,
                            redisSnapshot, activationPlan.
                          type: string
                        message:
                          type: string
                        node:
                          description: Node is set for artifacts that only exist on
                            one node.
                          type: string
                        ref:
                          description: Ref is the artifact reference (minio:// URI,
                            image tag, object name).
                          type: string
                        verifiedAt:
                          format: date-time
                          type: string
                      required:
                      - kind
                      type: object
                    type: array
                  commitTime:
                    format: date-time
                    type: string
                  epoch:
                    format: int64
                    type: integer
                  executable:
                    description: |-
                      Executable reports whether the preparation still holds on this reconcile.
                      A promoted RecoveryPoint whose image was deleted stays recorded here --
                      it is still the point this path would use -- but it stops being
                      executable, and the failing check says why.
                    type: boolean
                  logicalPosition:
                    format: int64
                    type: integer
                  name:
                    type: string
                  placement:
                    description: |-
                      Placement is the node the preparation belongs to. Node-bound artifacts in
                      Artifacts were verified on THIS node; evidence from any other node is not
                      evidence for this path.
                    properties:
                      allocatableCpuMillis:
                        description: |-
                          AllocatableCPUMillis / AllocatableMemoryMiB are what Kubernetes reports
                          the node offers after system reservations.
                        format: int64
                        type: integer
                      allocatableMemoryMiB:
                        format: int64
                        type: integer
                      cluster:
                        type: string
                      freeCpuMillis:
                        format: int64
                        type: integer
                      freeMemoryMiB:
                        format: int64
                        type: integer
                      node:
                        type: string
                      reason:
                        type: string
                      requestedCpuMillis:
                        description: |-
                          RequestedCPUMillis / RequestedMemoryMiB are the sums of the resource
                          REQUESTS of the non-terminated pods already on the node. Allocatable
                          minus requested is what a scheduler would treat as free; allocatable
                          alone is not "free capacity" and is not reported as such.
                        format: int64
                        type: integer
                      requestedMemoryMiB:
                        format: int64
                        type: integer
                      selectedAt:
                        format: date-time
                        type: string
                    required:
                    - cluster
                    - node
                    type: object
                  preparedAt:
                    description: PreparedAt is when this RecoveryPoint was promoted
                      from candidate.
                    format: date-time
                    type: string
                required:
                - name
                type: object
              readiness:
                description: "Readiness is the elastic recovery-readiness level of
                  a RecoveryPath.\n\nThe levels are defined against the RecoveryContract,
                  not against \"how many\nboxes are ticked\":\n\n\tHOT  : an EXECUTABLE
                  PREPARED path exists and currently satisfies both the\n\t       RPO
                  (the prepared RecoveryPoint is fresh enough) and the RTO (the\n\t
                  \      remaining failure-time work fits the budget). Failure-time
                  work is\n\t       activation only.\n\tWARM : recovery is feasible,
                  but either preparation work remains or the\n\t       contract cannot
                  currently be guaranteed (e.g. the prepared point has\n\t       gone
                  stale while its successor is still being prepared).\n\tCOLD : no
                  currently executable or sufficiently feasible recovery path."
                enum:
                - HOT
                - WARM
                - COLD
                type: string
              targetPlacement:
                description: TargetPlacement is the concrete node the prepared path
                  lands on.
                properties:
                  allocatableCpuMillis:
                    description: |-
                      AllocatableCPUMillis / AllocatableMemoryMiB are what Kubernetes reports
                      the node offers after system reservations.
                    format: int64
                    type: integer
                  allocatableMemoryMiB:
                    format: int64
                    type: integer
                  cluster:
                    type: string
                  freeCpuMillis:
                    format: int64
                    type: integer
                  freeMemoryMiB:
                    format: int64
                    type: integer
                  node:
                    type: string
                  reason:
                    type: string
                  requestedCpuMillis:
                    description: |-
                      RequestedCPUMillis / RequestedMemoryMiB are the sums of the resource
                      REQUESTS of the non-terminated pods already on the node. Allocatable
                      minus requested is what a scheduler would treat as free; allocatable
                      alone is not "free capacity" and is not reported as such.
                    format: int64
                    type: integer
                  requestedMemoryMiB:
                    format: int64
                    type: integer
                  selectedAt:
                    format: date-time
                    type: string
                required:
                - cluster
                - node
                type: object
              unmetMandatoryChecks:
                description: UnmetMandatoryChecks lists, by name, why the path is
                  not HOT.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
