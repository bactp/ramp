  labels:
    ramp.dcn.ssu.ac.kr/scenario: "1"
  name: video-stream-service
  namespace: ramp-demo
  resourceVersion: "12838232"
  uid: 4217b232-92e3-4c25-911a-ee09867a8b1d
spec:
  dependencies:
  - from: data
    to: streaming
    type: strict
  groups:
  - components:
    - name: redis
      order: 0
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: redis-primary
          namespace: ramp-demo
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: redis-primary
          template:
            metadata:
              labels:
                app: redis-primary
                ramp.dcn.ssu.ac.kr/role: redis-primary
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
              containers:
              - args:
                - --save
                - ""
                - --appendonly
                - "no"
                - --protected-mode
                - "no"
                - --repl-diskless-sync
                - "yes"
                - --repl-diskless-sync-delay
                - "0"
                image: redis:7-alpine
                name: redis
                ports:
                - containerPort: 6379
                  name: redis
                readinessProbe:
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  tcpSocket:
                    port: 6379
    - name: redis-service
      order: 1
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: redis
          namespace: ramp-demo
        spec:
          ports:
          - name: redis
            nodePort: 30379
            port: 6379
            targetPort: 6379
          selector:
            app: redis-primary
          type: NodePort
    name: data
    order: 0
  - components:
    - name: video
      order: 0
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: video-session
          namespace: ramp-demo
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: video-session
          template:
            metadata:
              labels:
                app: video-session
                ramp.dcn.ssu.ac.kr/role: video
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
              containers:
              - args:
                - |
                  import socket, time, os, json, uuid, hashlib, collections

                  HOST = os.environ.get("REDIS_HOST", "redis")
                  PORT = int(os.environ.get("REDIS_PORT", "6379"))
                  FPT  = int(os.environ.get("FRAMES_PER_TICK", "30"))
                  POS_KEY, SESS_KEY = "ramp:video:position", "ramp:video:session"
                  STATE = "/tmp/ramp-video-state.json"

                  def resp(*args):
                      out = ("*%d\r\n" % len(args)).encode()
                      for a in args:
                          b = str(a).encode()
                          out += b"$%d\r\n" % len(b) + b + b"\r\n"
                      s = socket.create_connection((HOST, PORT), timeout=3)
                      try:
                          s.sendall(out)
                          return s.recv(65536)
                      finally:
                          s.close()

                  # ---- in-memory ONLY state: lost unless the container is checkpointed
                  session  = str(uuid.uuid4())
                  frames   = 0
                  ring     = collections.deque(maxlen=8)

                  # ---- Redis-backed state: lost unless Redis replication survives
                  pos = 0
                  try:
                      r = resp("GET", POS_KEY)
                      if r.startswith(b"$") and not r.startswith(b"$-1"):
                          pos = int(r.split(b"\r\n")[1]); frames = pos * FPT
                          print("resumed cold from redis pos=%d" % pos, flush=True)
                  except Exception as e:
                      print("redis unavailable at start: %s" % e, flush=True)

                  print("video-session up session=%s pos=%d frames=%d" % (session, pos, frames), flush=True)

                  while True:
                      pos    += 1
                      frames += FPT
                      ring.append(hashlib.sha256(("%s:%d" % (session, pos)).encode()).hexdigest()[:12])
                      linked = True
                      try:
                          resp("SET", POS_KEY, pos)
                          resp("SET", SESS_KEY, session)
                      except Exception as e:
                          linked = False
                          print("redis write failed at pos=%d: %s" % (pos, e), flush=True)
                      st = {"session": session, "position": pos, "frames_decoded": frames,
                            "frames_per_tick": FPT, "ring_head": ring[-1],
                            "redis_linked": linked, "ts": time.time()}
                      try:
                          open(STATE, "w").write(json.dumps(st))
                      except Exception:
                          pass
                      if pos % 15 == 0:
                          print("pos=%d frames=%d invariant_ok=%s linked=%s"
                                % (pos, frames, frames == pos * FPT, linked), flush=True)
                      time.sleep(1)
                command:
                - python3
                - -u
                - -c
                env:
                - name: REDIS_HOST
                  value: redis.ramp-demo.svc.cluster.local
                - name: REDIS_PORT
                  value: "6379"
                - name: FRAMES_PER_TICK
                  value: "30"
                image: python:3.12-slim
                name: video
    - name: video-service
      order: 1
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: video-session
          namespace: ramp-demo
        spec:
          ports:
          - name: http
            port: 8080
            targetPort: 8080
          selector:
            app: video-session
          type: ClusterIP
    name: streaming
    order: 1
