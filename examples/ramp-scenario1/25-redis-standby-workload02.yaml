# Target-cluster (workload02) recovery prerequisites.
# These are NOT AppBundle components of the source application: they are the
# target-side half of the RecoveryPath. Redis recovers by its OWN native
# mechanism (replication), not by container checkpoint -- that heterogeneity is
# the research property Scenario 1 must demonstrate.
#
# Replication target address: workload01 NodePort 30379 reached through the
# workload01 control-plane FLOATING IP. The workload node network 10.6.0.0/24 is
# not routable between clusters (see 00-existing-system-audit.md Sec.1.1);
# 192.168.28.0/24 is the only shared transit network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-standby
  namespace: ramp-demo
  labels:
    ramp.dcn.ssu.ac.kr/role: redis-standby
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-standby}
  template:
    metadata:
      labels: {app: redis-standby, ramp.dcn.ssu.ac.kr/role: redis-standby}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --protected-mode
            - "no"
            - --replicaof
            - "192.168.28.238"
            - "30379"
            - --replica-read-only
            - "yes"
          ports:
            - {containerPort: 6379, name: redis}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ramp-demo
spec:
  type: NodePort
  selector: {app: redis-standby}
  ports:
    - {port: 6379, targetPort: 6379, nodePort: 30380, name: redis}
