# The recovery-consistency domain.
#
# Note what is NOT here: the redis-service and video-service AppBundle
# components. They are part of the application's deployment structure, but
# recovering them independently cannot violate correctness -- they are
# reconstructed, not recovered. They appear as RecoveryPath prerequisites
# instead. AppBundle != RecoveryGroup.
apiVersion: ramp.dcn.ssu.ac.kr/v1alpha1
kind: RecoveryGroup
metadata:
  name: video-stream-rg
  namespace: default
spec:
  appBundleRef:
    name: video-stream-service
    namespace: ramp-demo
    cluster: workload01

  members:
    # Redis recovers by its OWN native mechanism. It is deliberately NOT
    # checkpointed just because the video member is.
    - name: redis
      componentRef: {group: data, component: redis}
      recoveryDriver: redis-replication
      sourceEndpoint:
        host: 192.168.28.238   # workload01 NodePort via floating IP
        port: 30379
      consistencyKeys:
        - ramp:video:position

    # Video recovers by container/runtime checkpoint: its decode state lives in
    # process memory and no replication mechanism can reproduce it.
    - name: video
      componentRef: {group: streaming, component: video}
      recoveryDriver: container-checkpoint
      container: video

  # The contract is now ENFORCED by RecoveryPath readiness, not carried as
  # documentation:
  #   rpo -> the prepared RecoveryPoint must be younger than this, or the path
  #          stops claiming HOT even though it is still fully restorable
  #   rto -> the estimated activation latency (a sum of the remaining
  #          deterministic failure-time steps) must fit inside this
  #
  # 30m is honest for today: epochs are created by hand, so the age of the
  # prepared point is bounded by how often someone runs an epoch. Automatic
  # epoch cadence driven by this field is the NEXT task; until it exists, a
  # tight RPO here would just mean the path is permanently WARM.
  recoveryContract:
    rto: 60s
    rpo: 30m
